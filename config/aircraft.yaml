aircraft:
  name: test_aircraft
  model: "../aircraft/test_aircraft.vsp3"

# all / grid / trim / regression 由统一入口选择；这里仅定义 all 的默认组成。
analysis:
  modes: [GRID_DATABASE, TRIM_DATABASE]

# GRID smoke：2 个速度 × 2 个迎角 × 1 个侧滑角，共 4 个工况。
operating_conditions:
  speed: {start: 8, step: 1, end: 9, unit: m/s}
  alpha: {start: 0, step: 1, end: 1, unit: deg}
  beta: {values: [0], unit: deg}

grid:
  # adaptive 仅保留接口；只有 Numerical Convergence 为 PASS 时才允许启用。
  mode: uniform

atmosphere:
  rho_kg_m3: 1.225
  dynamic_viscosity_pa_s: 1.7894e-5
  speed_of_sound_mps: 340.294

geometry_sets:
  thin_set_index: 1
  thick_set_index: 2
  thin:
    - {name: Wing, type: Wing}
    - {name: Tail, type: Wing}
    - {name: TailV, type: Wing}
  thick:
    - {name: Fuselage, type: Fuselage}

solver:
  # 仅供 check/smoke/显式 --force 回退。Production 由收敛产物逐状态选择 Wake。
  wake_iterations: 3
  ncpu: 4
  tessellation_overrides:
    - {name: Wing, type: Wing, tess_u: 8, tess_w: 17}
    - {name: Tail, type: Wing, tess_u: 8, tess_w: 17}
    - {name: TailV, type: Wing, tess_u: 8, tess_w: 17}
    - {name: Fuselage, type: Fuselage, tess_u: 8, tess_w: 17}

numerical_convergence:
  wake:
    candidates: [3, 5, 8, 12]
    study_tessellation_preset: MEDIUM
    # 代表点覆盖线性区、真实 Trim、中迎角和带 beta 的较大迎角；Wake 结果由求解器决定。
    representative_states:
      - {name: linear_low_alpha, speed_mps: 8, alpha_deg: 0, beta_deg: 0}
      - {name: cruise_trim, speed_mps: 8, beta_deg: 0, trim: true}
      - {name: medium_alpha, speed_mps: 9, alpha_deg: 6, beta_deg: 0}
      - {name: high_alpha_beta, speed_mps: 9, alpha_deg: 10, beta_deg: 2}
    tolerance: &numerical_tolerance
      near_zero_reference: 0.05
      pass_relative: 0.03
      warn_relative: 0.08
      pass_absolute: 0.01
      warn_absolute: 0.03
    neighbor_count: 4
    boundary_buffer_normalized: 0.12
    safety_margin_levels_for_untested: 1
    max_boundary_checks: 3
  tessellation:
    # 各几何按气动职责分别加密，并在升力面前/后缘聚类；不是统一倍增。
    presets:
      COARSE:
        - {name: Wing, type: Wing, tess_u: 8, tess_w: 21, le_cluster: 0.18, te_cluster: 0.18}
        - {name: Tail, type: Wing, tess_u: 6, tess_w: 17, le_cluster: 0.20, te_cluster: 0.16}
        - {name: TailV, type: Wing, tess_u: 6, tess_w: 17, le_cluster: 0.20, te_cluster: 0.16}
        - {name: Fuselage, type: Fuselage, tess_u: 13, tess_w: 17}
      MEDIUM:
        - {name: Wing, type: Wing, tess_u: 12, tess_w: 31, le_cluster: 0.12, te_cluster: 0.10}
        - {name: Tail, type: Wing, tess_u: 8, tess_w: 25, le_cluster: 0.14, te_cluster: 0.10}
        - {name: TailV, type: Wing, tess_u: 8, tess_w: 25, le_cluster: 0.14, te_cluster: 0.10}
        - {name: Fuselage, type: Fuselage, tess_u: 21, tess_w: 25}
      FINE:
        - {name: Wing, type: Wing, tess_u: 18, tess_w: 45, le_cluster: 0.08, te_cluster: 0.06}
        - {name: Tail, type: Wing, tess_u: 12, tess_w: 35, le_cluster: 0.09, te_cluster: 0.06}
        - {name: TailV, type: Wing, tess_u: 12, tess_w: 35, le_cluster: 0.09, te_cluster: 0.06}
        - {name: Fuselage, type: Fuselage, tess_u: 33, tess_w: 37}
    representative_state_names: [cruise_trim, high_alpha_beta]
    tolerance: *numerical_tolerance
  trim:
    pretrim_wake_iterations: 5
    max_wake_upgrades: 3
  diagnostics:
    representative_state_name: cruise_trim
    rudder_steps_deg: [0.5, 1.0, 2.0, 4.0]
    tolerance: *numerical_tolerance
  production_gate:
    enabled: true

# source=model 从 .vsp3 的 VSPAEROSettings 读取 Sref/bref/cref 与 CG。
reference:
  source: model
  cg_source: model

# 正偏角定义为“增加 OpenVSP Control Surface Group 的 DeflectionAngle”。
# 实际舵面运动方向由模型内各 surface gain 和铰链方向决定。
controls:
  aileron: {group: Aileron, neutral_deg: 0, min_deg: -20, max_deg: 20}
  elevator: {group: Elevator, neutral_deg: 0, min_deg: -20, max_deg: 20}
  rudder: {group: Rudder, neutral_deg: 0, min_deg: -20, max_deg: 20}

# 稳态水平直飞纵向 Trim：Lift=Weight 且 Cm=0。
trim:
  enabled: true
  mass_kg: 25.0
  gravity_m_s2: 9.80665
  operating_conditions:
    speed: {values: [8], unit: m/s}
    beta: {values: [0], unit: deg}
  alpha: {initial_deg: 2, min_deg: -5, max_deg: 12}
  elevator: {initial_deg: 0, min_deg: -20, max_deg: 20}
  force_tolerance_n: 1.0
  moment_tolerance_nm: 1.0
  # 15 是停止上限，不是收敛判据；仅同时满足 ±1 N / ±1 N·m 才算成功。
  max_iterations: 15
  max_step_deg: 5

derivatives:
  manifest: "required_derivatives.yaml"
  scales: [0.5, 1.0, 2.0]
  perturbations:
    alpha_deg: 0.5
    beta_deg: 0.5
    p_rad_s: 0.01
    q_rad_s: 0.01
    r_rad_s: 0.01
    aileron_deg: 2.0
    elevator_deg: 2.0
    rudder_deg: 2.0
  convergence:
    near_zero_reference: 0.05
    pass_relative: 0.10
    warn_relative: 0.25
    pass_absolute: 0.02
    warn_absolute: 0.08

validation:
  conventional_fixed_wing: true
  symmetry:
    enabled: true
    base_coefficient_absolute_warn: 0.02
    base_coefficient_absolute_fail: 0.05
  physics:
    enabled: true
    derivative_absolute_limit: 100.0
  # OpenVSP 3.51.3 公开 API 无负 p/q/r 单点输入，此项必须保持显式。
  rate_derivative_method_status: WARN
  autotune_allow_warn: true

regression:
  speed_mps: 8
  beta_deg: 0
  baseline: "../tests/regression/baseline.json"
  pass_relative: 0.08
  warn_relative: 0.15
  pass_absolute: 0.03
  warn_absolute: 0.08

resume:
  enabled: true

export:
  output_root: "../results"
  csv: true
  json: true
  mat: true
