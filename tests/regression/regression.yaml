aircraft:
  name: test_aircraft
  model: "../../aircraft/test_aircraft.vsp3"

analysis:
  modes: [GRID_DATABASE, TRIM_DATABASE]

operating_conditions:
  speed: {start: 8, step: 1, end: 9, unit: m/s}
  alpha: {start: 0, step: 1, end: 1, unit: deg}
  beta: {values: [0], unit: deg}

grid:
  mode: uniform
  adaptive:
    quantities: [CL, CD, Cm, CY, Cl, Cn]
    tolerance:
      near_zero_reference: 0.05
      pass_relative: 0.03
      warn_relative: 0.08
      pass_absolute: 0.005
      warn_absolute: 0.02
    max_depth: 3
    max_cases: 100
    min_spacing: {speed_mps: 0.25, alpha_deg: 0.25, beta_deg: 0.25}

atmosphere:
  rho_kg_m3: 1.225
  dynamic_viscosity_pa_s: 1.7894e-5
  speed_of_sound_mps: 340.294

geometry_sets:
  thin_set_index: 1
  thick_set_index: 2
  thin:
    - {name: Wing, type: Wing}
    - {name: Tail, type: Wing}
    - {name: TailV, type: Wing}
  thick:
    - {name: Fuselage, type: Fuselage}

solver:
  wake_iterations: 3
  ncpu: 4
  run_unsteady_diagnostics: false

numerical_convergence:
  wake:
    candidates: [3, 5, 8, 12]
    verification_only_level: 16
    representative_states:
      - {name: linear_low_alpha, speed_mps: 8, alpha_deg: 0, beta_deg: 0}
      - {name: cruise_trim, speed_mps: 8, beta_deg: 0, trim: true}
      - {name: medium_alpha, speed_mps: 9, alpha_deg: 6, beta_deg: 0}
    tolerance: &numerical_tolerance
      near_zero_reference: 0.05
      pass_relative: 0.03
      warn_relative: 0.08
      pass_absolute: 0.01
      warn_absolute: 0.03
    neighbor_count: 3
    boundary_buffer_normalized: 0.12
    safety_margin_levels_for_untested: 1
    max_boundary_checks: 2
  trim:
    pretrim_wake_iterations: 3
    max_wake_upgrades: 3
  fd_step:
    representative_state_name: cruise_trim
  production_gate:
    enabled: false

reference:
  source: model
  cg_source: model

controls:
  aileron: {group: Aileron, neutral_deg: 0, min_deg: -20, max_deg: 20}
  elevator: {group: Elevator, neutral_deg: 0, min_deg: -20, max_deg: 20}
  rudder: {group: Rudder, neutral_deg: 0, min_deg: -20, max_deg: 20}

trim:
  enabled: true
  mass_kg: 25.0
  gravity_m_s2: 9.80665
  operating_conditions:
    speed: {values: [8], unit: m/s}
    beta: {values: [0], unit: deg}
  alpha: {initial_deg: 2, min_deg: -5, max_deg: 12}
  elevator: {initial_deg: 0, min_deg: -20, max_deg: 20}
  force_tolerance_n: 1.0
  moment_tolerance_nm: 1.0
  max_iterations: 15
  max_step_deg: 5

derivatives:
  manifest: "../../config/required_derivatives.yaml"
  fd_step_candidates_deg:
    alpha: [0.25, 0.5, 1.0]
    beta: [0.25, 0.5, 1.0]
    elevator: [0.5, 1.0, 2.0]
    aileron: [0.5, 1.0, 2.0]
    rudder: [0.5, 1.0, 2.0]
  trim_jacobian_steps_deg: {alpha: 0.5, elevator: 2.0}
  convergence:
    near_zero_reference: 0.05
    pass_relative: 0.10
    warn_relative: 0.25
    pass_absolute: 0.02
    warn_absolute: 0.08

validation:
  conventional_fixed_wing: true
  symmetry:
    enabled: true
    base_coefficient_absolute_warn: 0.02
    base_coefficient_absolute_fail: 0.05
  physics:
    enabled: true
    derivative_absolute_limit: 100.0
  autotune_allow_warn: true

regression:
  speed_mps: 8
  beta_deg: 0
  baseline: "baseline.json"
  pass_relative: 0.08
  warn_relative: 0.15
  pass_absolute: 0.03
  warn_absolute: 0.08

resume:
  enabled: true

export:
  output_root: "../../results"
  csv: true
  json: true
  mat: true
